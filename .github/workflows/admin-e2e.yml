name: Admin Panel E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  admin-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright (Python) + Chromium
        run: |
          python -m pip install --no-cache-dir playwright
          python -m playwright install --with-deps chromium

      - name: Start dev server
        run: |
          # CI build opts into the AAL2 bypass; token is a repo secret and
          # is never present in production builds.
          export VITE_E2E_BYPASS_AAL2=true
          export VITE_E2E_BYPASS_TOKEN="${{ secrets.E2E_BYPASS_TOKEN }}"
          bun run dev > /tmp/dev-server.log 2>&1 &
          echo $! > /tmp/dev-server.pid
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8080 > /dev/null; then
              echo "dev server ready"; exit 0
            fi
            sleep 2
          done
          echo "dev server failed to start"; tail -n 200 /tmp/dev-server.log; exit 1

      - name: Run admin E2E
        env:
          BASE_URL: http://localhost:8080
          OUT_DIR: admin-e2e-output
          E2E_BYPASS_TOKEN: ${{ secrets.E2E_BYPASS_TOKEN }}
          # Optional CI-provided session (set as repo secrets to enable
          # authenticated coverage in CI). Absent locally = unauthenticated.
          LOVABLE_BROWSER_SUPABASE_STORAGE_KEY: ${{ secrets.E2E_SUPABASE_STORAGE_KEY }}
          LOVABLE_BROWSER_SUPABASE_SESSION_JSON: ${{ secrets.E2E_SUPABASE_SESSION_JSON }}
          LOVABLE_BROWSER_SUPABASE_COOKIES_JSON: ${{ secrets.E2E_SUPABASE_COOKIES_JSON }}
        run: python scripts/admin-e2e.py

      - name: Stop dev server
        if: always()
        run: kill "$(cat /tmp/dev-server.pid)" 2>/dev/null || true

      - name: Upload E2E summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e-summary
          path: admin-e2e-output/summary.json
          if-no-files-found: warn

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e-screenshots
          path: admin-e2e-output/screenshots/**
          if-no-files-found: warn

      # Only upload the full Playwright trace when the job failed — traces are
      # heavy and rarely needed for green runs. Open with `playwright show-trace`.
      - name: Upload Playwright trace (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e-trace
          path: admin-e2e-output/trace.zip
          if-no-files-found: warn

      - name: Upload dev server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e-devserver-log
          path: /tmp/dev-server.log
          if-no-files-found: warn