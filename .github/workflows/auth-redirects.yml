name: Auth Redirects (unit + WebView E2E)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Guards the redirect surface that email links + WebView deep links depend on:
#   - src/lib/app-url.ts + tests → email/OAuth redirect origins stay https
#   - src/routes/auth.tsx safeRedirect → no open redirect, no /auth loop
#   - tests/e2e/webview-auth-redirects.spec.py → /onboarding/wizard, /reset-password
#     and /forgot-password behave correctly in a WebView-like context.
# A regression here can silently break sign-up, password recovery, or the
# native shell without a build error, so this workflow runs on every PR.

jobs:
  unit:
    name: Unit (app-url + safeRedirect)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Vitest — redirect helpers with coverage
        # Runs the two focused test files under v8 coverage; vitest.config.ts
        # enforces 100% coverage on src/lib/app-url.ts and prints an uncovered-
        # lines table for src/routes/auth.tsx so gaps are visible in the log.
        run: bun run test:coverage:redirects

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-redirects-coverage
          path: coverage
          if-no-files-found: warn

  webview-e2e:
    name: E2E (WebView-simulated redirects)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
      pull-requests: write
    env:
      E2E_MAX_ATTEMPTS: "3"
      E2E_RETRY_BACKOFF_SECONDS: "5"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --no-cache-dir playwright
          python -m playwright install --with-deps chromium

      - name: Start dev server
        run: |
          bun run dev > /tmp/dev-server.log 2>&1 &
          echo $! > /tmp/dev-server.pid
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8080 > /dev/null; then
              echo "dev server ready"; exit 0
            fi
            sleep 2
          done
          echo "dev server failed to start"; tail -n 200 /tmp/dev-server.log; exit 1

      - name: Run WebView redirect spec (with auto-retry on flake)
        # Retries up to E2E_MAX_ATTEMPTS times to absorb intermittent
        # dev-server / Chromium flakes (network stalls, first-hit HMR compile,
        # transient timeouts). Each attempt's log is preserved separately and
        # run.log points at the successful (or last) attempt. Fails the job
        # only after every attempt exhausts.
        run: |
          mkdir -p /tmp/browser/webview-redirects
          attempt=1
          rc=1
          while [ "$attempt" -le "$E2E_MAX_ATTEMPTS" ]; do
            echo "::group::WebView E2E attempt $attempt / $E2E_MAX_ATTEMPTS"
            # Per-attempt artifact bucket: the spec writes screenshots,
            # trace.zip, video/*.webm, and browser-console.log into
            # WEBVIEW_E2E_ARTIFACT_DIR. Keeping each attempt in its own
            # directory means a passing final attempt never overwrites the
            # forensic evidence from the earlier failed ones.
            attempt_dir="/tmp/browser/webview-redirects/attempt-${attempt}"
            mkdir -p "$attempt_dir"
            log="${attempt_dir}/run.log"
            set +e
            set -o pipefail
            WEBVIEW_E2E_ARTIFACT_DIR="$attempt_dir" \
              python tests/e2e/webview-auth-redirects.spec.py 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            set +o pipefail
            set -e
            # Mirror the log at the top level too (legacy path used by prior
            # tooling that greps /tmp/browser/webview-redirects/run.attempt-*.log).
            cp -f "$log" "/tmp/browser/webview-redirects/run.attempt-${attempt}.log"
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "attempt $attempt succeeded"
              cp -f "$log" /tmp/browser/webview-redirects/run.log
              break
            fi
            echo "::warning::WebView E2E attempt $attempt failed (exit=$rc). See attempt-${attempt}/ artifacts (screenshots, trace.zip, video/, browser-console.log)."
            if [ "$attempt" -lt "$E2E_MAX_ATTEMPTS" ]; then
              sleep "$E2E_RETRY_BACKOFF_SECONDS"
            fi
            attempt=$((attempt + 1))
          done
          if [ ! -f /tmp/browser/webview-redirects/run.log ]; then
            cp -f "/tmp/browser/webview-redirects/run.attempt-$((attempt - 1)).log" \
              /tmp/browser/webview-redirects/run.log || true
          fi
          exit "$rc"

      - name: Stop dev server
        if: always()
        run: kill "$(cat /tmp/dev-server.pid)" 2>/dev/null || true

      - name: Collect dev-server log into artifact bundle
        if: always()
        run: |
          mkdir -p /tmp/browser/webview-redirects
          cp -f /tmp/dev-server.log /tmp/browser/webview-redirects/dev-server.log || true

      - name: Upload WebView E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webview-auth-redirects-artifacts
          # Contains, per attempt: screenshots (1_..11_..png), Playwright
          # trace.zip (open with `playwright show-trace`), video/*.webm
          # captures of every page, browser-console.log (console + pageerror
          # + failed requests), and the attempt's run.log. Plus the top-level
          # dev-server.log and run.log for the last/successful attempt.
          # Uploaded on both pass and fail so reviewers can diagnose flakes
          # without having to reproduce them locally.
          path: /tmp/browser/webview-redirects
          if-no-files-found: warn
          retention-days: 14

      - name: Upload attempt-1 artifacts
        if: always()
        id: upload-attempt-1
        uses: actions/upload-artifact@v4
        with:
          name: webview-auth-redirects-attempt-1
          path: /tmp/browser/webview-redirects/attempt-1
          if-no-files-found: warn
          retention-days: 14

      - name: Upload attempt-2 artifacts
        if: always()
        id: upload-attempt-2
        uses: actions/upload-artifact@v4
        with:
          name: webview-auth-redirects-attempt-2
          path: /tmp/browser/webview-redirects/attempt-2
          if-no-files-found: warn
          retention-days: 14

      - name: Upload attempt-3 artifacts
        if: always()
        id: upload-attempt-3
        uses: actions/upload-artifact@v4
        with:
          name: webview-auth-redirects-attempt-3
          path: /tmp/browser/webview-redirects/attempt-3
          if-no-files-found: warn
          retention-days: 14

      - name: Comment PR with E2E artifact links
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ATTEMPT_1_URL: ${{ steps.upload-attempt-1.outputs.artifact-url }}
          ATTEMPT_2_URL: ${{ steps.upload-attempt-2.outputs.artifact-url }}
          ATTEMPT_3_URL: ${{ steps.upload-attempt-3.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- webview-auth-redirects-e2e -->';
            const maxAttempts = parseInt(process.env.E2E_MAX_ATTEMPTS || '3', 10);
            const rows = [
              { n: 1, url: process.env.ATTEMPT_1_URL },
              { n: 2, url: process.env.ATTEMPT_2_URL },
              { n: 3, url: process.env.ATTEMPT_3_URL },
            ].slice(0, maxAttempts);

            let table = '| Attempt | Download |\n|---------|----------|\n';
            for (const { n, url } of rows) {
              table += `| Attempt ${n} | ${url ? `[artifacts](${url})` : 'not available'} |\n`;
            }

            const body = [
              marker,
              '## ❌ WebView Auth Redirects E2E failed',
              '',
              `All ${maxAttempts} attempts failed. Download the forensic evidence per attempt to diagnose the flake:`,
              '',
              table,
              '',
              'Each artifact contains screenshots, Playwright `trace.zip` (open with `playwright show-trace`), `video/*.webm`, `browser-console.log`, and the attempt’s `run.log`.',
              '',
              `Also see the combined artifact bundle: [webview-auth-redirects-artifacts](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }



