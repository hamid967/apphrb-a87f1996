name: Auth Redirects (unit + WebView E2E)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Guards the redirect surface that email links + WebView deep links depend on:
#   - src/lib/app-url.ts + tests → email/OAuth redirect origins stay https
#   - src/routes/auth.tsx safeRedirect → no open redirect, no /auth loop
#   - tests/e2e/webview-auth-redirects.spec.py → /onboarding/wizard, /reset-password
#     and /forgot-password behave correctly in a WebView-like context.
# A regression here can silently break sign-up, password recovery, or the
# native shell without a build error, so this workflow runs on every PR.

jobs:
  unit:
    name: Unit (app-url + safeRedirect)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Vitest — redirect helpers with coverage
        # Runs the two focused test files under v8 coverage; vitest.config.ts
        # enforces 100% coverage on src/lib/app-url.ts and prints an uncovered-
        # lines table for src/routes/auth.tsx so gaps are visible in the log.
        run: bun run test:coverage:redirects

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-redirects-coverage
          path: coverage
          if-no-files-found: warn

  webview-e2e:
    name: E2E (WebView-simulated redirects)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --no-cache-dir playwright
          python -m playwright install --with-deps chromium

      - name: Start dev server
        run: |
          bun run dev > /tmp/dev-server.log 2>&1 &
          echo $! > /tmp/dev-server.pid
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8080 > /dev/null; then
              echo "dev server ready"; exit 0
            fi
            sleep 2
          done
          echo "dev server failed to start"; tail -n 200 /tmp/dev-server.log; exit 1

      - name: Run WebView redirect spec (with auto-retry on flake)
        # Retries up to E2E_MAX_ATTEMPTS times to absorb intermittent
        # dev-server / Chromium flakes (network stalls, first-hit HMR compile,
        # transient timeouts). Each attempt's log is preserved separately and
        # run.log points at the successful (or last) attempt. Fails the job
        # only after every attempt exhausts.
        env:
          E2E_MAX_ATTEMPTS: "3"
          E2E_RETRY_BACKOFF_SECONDS: "5"
        run: |
          mkdir -p /tmp/browser/webview-redirects
          attempt=1
          rc=1
          while [ "$attempt" -le "$E2E_MAX_ATTEMPTS" ]; do
            echo "::group::WebView E2E attempt $attempt / $E2E_MAX_ATTEMPTS"
            log="/tmp/browser/webview-redirects/run.attempt-${attempt}.log"
            set +e
            set -o pipefail
            python tests/e2e/webview-auth-redirects.spec.py 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            set +o pipefail
            set -e
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "attempt $attempt succeeded"
              cp -f "$log" /tmp/browser/webview-redirects/run.log
              break
            fi
            echo "attempt $attempt failed (exit=$rc)"
            if [ "$attempt" -lt "$E2E_MAX_ATTEMPTS" ]; then
              sleep "$E2E_RETRY_BACKOFF_SECONDS"
            fi
            attempt=$((attempt + 1))
          done
          if [ ! -f /tmp/browser/webview-redirects/run.log ]; then
            cp -f "/tmp/browser/webview-redirects/run.attempt-$((attempt - 1)).log" \
              /tmp/browser/webview-redirects/run.log || true
          fi
          exit "$rc"

      - name: Stop dev server
        if: always()
        run: kill "$(cat /tmp/dev-server.pid)" 2>/dev/null || true

      - name: Collect dev-server log into artifact bundle
        if: always()
        run: |
          mkdir -p /tmp/browser/webview-redirects
          cp -f /tmp/dev-server.log /tmp/browser/webview-redirects/dev-server.log || true

      - name: Upload WebView E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webview-auth-redirects-artifacts
          # Contains screenshots (1_..10_..png), the full run transcript, and
          # the dev-server log. Uploaded on both pass and fail so reviewers
          # can inspect the exact WebView state each PR produced.
          path: /tmp/browser/webview-redirects
          if-no-files-found: warn
          retention-days: 14

