name: pr-title-lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: read
  contents: read

jobs:
  lint-title:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Validate PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 <<'PY'
          import os, sys, re

          title = (os.environ.get("PR_TITLE") or "").strip()

          # الصيغة المطلوبة:
          #   <type>(<scope>): <subject>
          #
          # أمثلة صحيحة:
          #   feat(ui): إضافة صفحة عرض الفواتير
          #   fix(db): تصحيح سياسة RLS على expenses
          #   chore(infra): تحديث Playwright إلى v1.50
          #   migration(db): إضافة جدول payment_schedules
          #
          # types  = feat | fix | refactor | migration | docs | chore | test | perf | revert
          # scopes = db | ui | server | infra | ci | i18n | a11y | seo | deps | release

          TYPES  = ["feat","fix","refactor","migration","docs","chore","test","perf","revert"]
          SCOPES = ["db","ui","server","infra","ci","i18n","a11y","seo","deps","release"]

          pattern = re.compile(
              rf"^(?P<type>{'|'.join(TYPES)})"
              rf"\((?P<scope>{'|'.join(SCOPES)})\)"
              r":\s+(?P<subject>.+)$"
          )

          errors = []

          m = pattern.match(title)
          if not m:
              errors.append(
                  "عنوان الـ PR لا يتبع الصيغة المطلوبة.\n"
                  "  الصيغة:  <type>(<scope>): <subject>\n"
                  f"  types :  {' | '.join(TYPES)}\n"
                  f"  scopes:  {' | '.join(SCOPES)}\n"
                  "  مثال  :  feat(ui): إضافة لوحة تقارير المصروفات\n"
                  "  مثال  :  migration(db): إنشاء جدول payment_schedules"
              )
          else:
              subject = m.group("subject").strip()
              t = m.group("type")
              s = m.group("scope")

              # القواعد الإضافية
              if len(subject) < 10:
                  errors.append(f"الوصف بعد ':' قصير جداً ({len(subject)} حرف) — الحد الأدنى 10.")
              if len(title) > 100:
                  errors.append(f"العنوان طويل جداً ({len(title)} حرف) — الحد الأقصى 100.")
              if subject.lower() in {"wip","update","updates","fix","fixes","changes","tweaks"}:
                  errors.append(f"وصف عام مرفوض: '{subject}'.")
              if subject.endswith("."):
                  errors.append("لا تُنهِ العنوان بنقطة.")

              # قواعد اتساق type/scope
              if t == "migration" and s != "db":
                  errors.append("النوع 'migration' يجب أن يستخدم scope 'db' فقط.")
              if t == "docs" and s not in {"ui","server","db","infra","ci","i18n","seo"}:
                  # docs عام مسموح
                  pass

          if errors:
              print("::error::عنوان الـ PR غير صالح")
              for e in errors:
                  print("::error::" + e)
                  print(e)
              print(f"\nالعنوان الحالي: {title!r}")
              sys.exit(1)

          print(f"✅ العنوان صالح: {title}")
          PY
