name: Admin Routes (signed-in)

# Runs tests/e2e/admin-routes-signed-in.spec.py against a locally built
# dev server, using a super-admin session minted at job start via
# scripts/e2e-mint-admin-session.py.
#
# Required repository secrets:
#   E2E_ADMIN_EMAIL      — super-admin email (e.g. hamid@hrhbs.com)
#   E2E_ADMIN_PASSWORD   — password for that account
#   E2E_BYPASS_TOKEN     — >=16 chars; matches VITE_E2E_BYPASS_TOKEN in
#                          the dev build so the AAL2 gate lets the test
#                          through in CI (production builds strip both
#                          vars, so the bypass branch is dead code there).
#
# Public envs baked into the dev build:
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY  (from .env)
#   VITE_E2E_BYPASS_AAL2=true, VITE_E2E_BYPASS_TOKEN  (CI only)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  admin-routes-signed-in:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright (Python) + Chromium
        run: |
          python -m pip install --no-cache-dir playwright
          python -m playwright install --with-deps chromium

      - name: Preflight — required secrets present
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_BYPASS_TOKEN: ${{ secrets.E2E_BYPASS_TOKEN }}
        run: |
          missing=()
          [ -n "$E2E_ADMIN_EMAIL" ]    || missing+=("E2E_ADMIN_EMAIL")
          [ -n "$E2E_ADMIN_PASSWORD" ] || missing+=("E2E_ADMIN_PASSWORD")
          [ -n "$E2E_BYPASS_TOKEN" ]   || missing+=("E2E_BYPASS_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            echo "Add them in Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ "${#E2E_BYPASS_TOKEN}" -lt 16 ]; then
            echo "::error::E2E_BYPASS_TOKEN must be at least 16 characters."
            exit 1
          fi

      - name: Start dev server (with AAL2 bypass token baked in)
        env:
          VITE_E2E_BYPASS_AAL2: "true"
          VITE_E2E_BYPASS_TOKEN: ${{ secrets.E2E_BYPASS_TOKEN }}
        run: |
          bun run dev > /tmp/dev-server.log 2>&1 &
          echo $! > /tmp/dev-server.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080 > /dev/null; then
              echo "dev server ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::dev server failed to start"
          tail -n 200 /tmp/dev-server.log
          exit 1

      - name: Mint super-admin session
        env:
          # scripts/e2e-mint-admin-session.py reads VITE_* from .env,
          # but the CI checkout may not have those; pass them explicitly.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          BASE_URL: http://localhost:8080
        run: |
          # Fall back to committed .env values when repo variables aren't set.
          if [ -z "$VITE_SUPABASE_URL" ] && [ -f .env ]; then
            set -a; . ./.env; set +a
          fi
          python scripts/e2e-mint-admin-session.py

      - name: Run admin routes signed-in scan
        env:
          E2E_BYPASS_TOKEN: ${{ secrets.E2E_BYPASS_TOKEN }}
          VITE_E2E_BYPASS_TOKEN: ${{ secrets.E2E_BYPASS_TOKEN }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          ADMIN_E2E_ARTIFACT_ROOT: ${{ github.workspace }}/admin-e2e-artifacts
          ADMIN_E2E_RUN_ID: run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] && [ -f .env ]; then
            set -a; . ./.env; set +a
          fi
          # Export LOVABLE_BROWSER_SUPABASE_* from the freshly minted session
          # so the spec's auth-source resolver picks "env".
          eval "$(python scripts/e2e-mint-admin-session.py --print-source)"
          python tests/e2e/admin-routes-signed-in.spec.py

      - name: Stop dev server
        if: always()
        run: kill "$(cat /tmp/dev-server.pid)" 2>/dev/null || true

      - name: Upload run artifacts (screenshots + video + report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-routes-signed-in-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/admin-e2e-artifacts/**
          if-no-files-found: warn

      - name: Upload dev server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-routes-signed-in-devserver-log
          path: /tmp/dev-server.log
          if-no-files-found: warn