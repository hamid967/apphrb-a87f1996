name: pr-description-check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: read
  contents: read

jobs:
  validate-description:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Ensure PR body contains all required sections
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 <<'PY'
          import os, sys, re

          body  = os.environ.get("PR_BODY")  or ""
          title = os.environ.get("PR_TITLE") or ""

          # الأقسام المطلوبة — كل عنصر: (المفتاح المعروض، regex يطابق عنوان القسم)
          required = [
              ("النطاق (Scope)",              r"##\s*🎯?\s*النطاق"),
              ("التغييرات (Changes)",         r"##\s*📦?\s*التغييرات"),
              ("المخاطر (Risk Assessment)",   r"##\s*⚠️?\s*المخاطر"),
              ("الاختبار (Testing)",          r"##\s*🧪?\s*الاختبار"),
              ("Migrations Checklist",        r"##\s*🗄️?\s*Migrations\s*Checklist"),
              ("Security Checklist",          r"##\s*🔐?\s*Security\s*Checklist"),
              ("i18n & Accessibility",        r"##\s*🌐?\s*i18n\s*&\s*Accessibility"),
              ("قبل طلب المراجعة",             r"##\s*✅?\s*قبل\s*طلب\s*المراجعة"),
          ]

          missing = [name for name, pat in required if not re.search(pat, body)]

          # منع العناوين العامة
          bad_titles = {"wip", "updates", "update", "fix", "fixes", "changes"}
          weak_title = title.strip().lower() in bad_titles or len(title.strip()) < 8

          # ضمان أن قسم "ماذا يفعل هذا الـ PR" ليس فارغاً (ليس مجرد التعليق التوضيحي)
          scope_empty = False
          m = re.search(r"##\s*🎯?\s*النطاق[\s\S]{0,400}?ماذا\s+يفعل\s+هذا\s+الـ\s*PR[^\n]*\n+([\s\S]*?)(?=\n##|\n\*\*Issue|$)", body)
          if m:
              scope_txt = re.sub(r"<!--[\s\S]*?-->", "", m.group(1)).strip()
              if not scope_txt or len(scope_txt) < 15:
                  scope_empty = True
          else:
              scope_empty = True

          errors = []
          if missing:
              errors.append("أقسام مفقودة من وصف الـ PR:\n  - " + "\n  - ".join(missing))
          if scope_empty:
              errors.append("قسم 'النطاق' فارغ — اكتب جملة واحدة تصف ما يفعله الـ PR.")
          if weak_title:
              errors.append(f"عنوان الـ PR ضعيف/عام: '{title}' — اكتب عنواناً وصفياً.")

          if errors:
              print("::error::وصف الـ PR غير مكتمل — راجع .github/PULL_REQUEST_TEMPLATE.md")
              for e in errors:
                  print("::error::" + e)
                  print(e)
              sys.exit(1)

          print("✅ وصف الـ PR يحتوي على كل الأقسام المطلوبة.")
          PY
